spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: backend

  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local_kakao_client_id_placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local_kakao_client_secret_placeholder}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:farmflate_local_development_jwt_secret_key_2026_farmflate_security_key_must_be_long}
    expiration: 86400000 # 24 hours in ms
  external:
    data-go-kr:
      service-key: ${DATA_GO_KR_SERVICE_KEY:local_data_go_kr_key}
    vworld:
      api-key: ${VWORLD_API_KEY:local_vworld_key}
    nongsaro:
      api-key: ${NONGSARO_API_KEY:local_nongsaro_key}
  data-mode: ${DATA_MODE:LIVE}
  external-api:
    timeout-ms: ${EXTERNAL_API_TIMEOUT_MS:8000}
    retry-count: ${EXTERNAL_API_RETRY_COUNT:1}
  cache:
    region-analysis-hours: ${REGION_ANALYSIS_CACHE_HOURS:6}
    short-forecast-minutes: ${SHORT_FORECAST_CACHE_MINUTES:30}
    asos-hours: ${ASOS_CACHE_HOURS:24}
    soil-chemistry-days: ${SOIL_CHEMISTRY_CACHE_DAYS:30}
    soil-suitability-days: ${SOIL_SUITABILITY_CACHE_DAYS:90}
    legal-district-days: ${LEGAL_DISTRICT_CACHE_DAYS:30}
    crop-code-days: ${CROP_CODE_CACHE_DAYS:90}
  python-server:
    url: ${PYTHON_SERVER_URL:http://localhost:8000}
