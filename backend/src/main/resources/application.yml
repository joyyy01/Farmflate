spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: backend

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local_kakao_client_id_placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local_kakao_client_secret_placeholder}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:farmflate_local_development_jwt_secret_key_2026_farmflate_security_key_must_be_long}
    expiration: 86400000 # 24 hours in ms
  external:
    data-go-kr:
      service-key: ${DATA_GO_KR_SERVICE_KEY:local_data_go_kr_key}
    vworld:
      api-key: ${VWORLD_API_KEY:local_vworld_key}
      address-url: ${VWORLD_ADDRESS_URL:https://api.vworld.kr/req/address}
    parcel:
      identifier-url: ${PARCEL_IDENTIFIER_URL:}
      api-key: ${PARCEL_IDENTIFIER_API_KEY:}
    nongsaro:
      api-key: ${NONGSARO_API_KEY:local_nongsaro_key}
  external-api:
    timeout-ms: ${EXTERNAL_API_TIMEOUT_MS:8000}
    location-timeout-ms: ${LOCATION_API_TIMEOUT_MS:5000}
    retry-count: ${EXTERNAL_API_RETRY_COUNT:1}
    rda-min-interval-ms: ${RDA_MIN_INTERVAL_MS:500}
    soil-chemistry-sample-dongs: ${SOIL_CHEMISTRY_SAMPLE_DONGS:1}
    soil-suitability-sample-dongs: ${SOIL_SUITABILITY_SAMPLE_DONGS:1}
    # Optional precise override: "52790=21F10501,....". Without it, the
    # analysis labels KMA's 4–10 day forecast as a representative-area signal.
    midterm-region-overrides: ${MIDTERM_REGION_OVERRIDES:}
  cache:
    region-analysis-hours: ${REGION_ANALYSIS_CACHE_HOURS:6}
    short-forecast-minutes: ${SHORT_FORECAST_CACHE_MINUTES:30}
    midterm-forecast-minutes: ${MIDTERM_FORECAST_CACHE_MINUTES:360}
    asos-hours: ${ASOS_CACHE_HOURS:24}
    soil-chemistry-days: ${SOIL_CHEMISTRY_CACHE_DAYS:30}
    soil-suitability-days: ${SOIL_SUITABILITY_CACHE_DAYS:90}
    legal-district-days: ${LEGAL_DISTRICT_CACHE_DAYS:30}
    crop-code-days: ${CROP_CODE_CACHE_DAYS:90}
  python-server:
    url: ${PYTHON_SERVER_URL:http://localhost:8000}
    internal-api-key: ${PYTHON_INTERNAL_API_KEY:farmflate-local-internal-key}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:15000}
